name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Check racc parser is up-to-date
        run: bundle exec rake cddal:check_regen

      - name: Lint registry (no raw MDC/EXT/CIM literals)
        run: bundle exec rake lint:registry

      - name: Run specs
        run: bundle exec rake spec

      - name: Build gem
        run: bundle exec rake build

      - name: Cache .bundle and pkg
        uses: actions/cache@v4
        with:
          path: |
            .bundle
            pkg
          key: bundle-pkg-${{ matrix.ruby }}-${{ hashFiles('**/*.gemspec', 'Gemfile', 'Gemfile.lock') }}
          restore-keys: |
            bundle-pkg-${{ matrix.ruby }}-

  crosscheck-spec:
    # Cross-validate the cddal-spec sibling repo against the Ruby
    # registry. Only runs when opencdd/cddal-spec is reachable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if cddal-spec repo exists
        id: check
        run: |
          if gh repo view opencdd/cddal-spec >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "cddal-spec repo not found; skipping crosscheck."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.check.outputs.present == 'true'
        with:
          repository: opencdd/cddal-spec
          path: cddal-spec

      - uses: ruby/setup-ruby@v1
        if: steps.check.outputs.present == 'true'
        with:
          bundler-cache: true

      - name: Crosscheck cddal-spec literals against Ruby registry
        if: steps.check.outputs.present == 'true'
        run: bin/crosscheck-cddal-spec
        env:
          CDDAL_SPEC_DIR: cddal-spec/sources
