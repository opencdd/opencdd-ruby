name: release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch (or pre|rc|etc).
          Also, you can pass 'skip' to skip 'git tag' and do 'gem push' for the current version
        required: true
        default: 'patch'
  repository_dispatch:
    types: [ do-release ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OPENCDD_CI_PAT_TOKEN }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Install gem-release
        run: gem install gem-release

      - name: Bump version
        if: inputs.next_version != 'skip'
        run: gem bump --version ${{ inputs.next_version }} --tag --push

      - name: Resolve gem identity
        id: gem
        run: |
          GEMSPEC=$(ls *.gemspec | head -1)
          GEM_NAME=$(ruby -e "puts Gem::Specification.load('${GEMSPEC}').name")
          GEM_VERSION=$(ruby -e "puts Gem::Specification.load('${GEMSPEC}').version.to_s")
          echo "name=${GEM_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GEM_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Idempotency guard
        id: guard
        env:
          GEM_NAME: ${{ steps.gem.outputs.name }}
          GEM_VERSION: ${{ steps.gem.outputs.version }}
        run: |
          published=$(gem list --remote --exact --version "$GEM_VERSION" "$GEM_NAME" 2>/dev/null | grep "$GEM_NAME ($GEM_VERSION)" || true)
          if [ -n "$published" ]; then
            echo "skip_push=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$GEM_NAME $GEM_VERSION is already published; skipping push"
          else
            echo "skip_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gem
        if: steps.guard.outputs.skip_push != 'true'
        run: |
          bundle install --jobs 4 --retry 3 --without development test
          gem build *.gemspec

      - name: Configure RubyGems credentials (trusted publishing)
        if: steps.guard.outputs.skip_push != 'true'
        uses: rubygems/configure-rubygems-credentials@v1

      - name: Push gem
        if: steps.guard.outputs.skip_push != 'true'
        run: |
          gem push *.gem
          gem exec rubygems-await *.gem

      - name: Verify published
        if: steps.guard.outputs.skip_push != 'true'
        env:
          GEM_NAME: ${{ steps.gem.outputs.name }}
          GEM_VERSION: ${{ steps.gem.outputs.version }}
        run: |
          for i in $(seq 1 24); do
            if curl -sf "https://rubygems.org/api/v1/versions/${GEM_NAME}.json" \
                 | jq -e --arg v "$GEM_VERSION" '.[] | select(.number == $v)' > /dev/null 2>&1; then
              echo "✓ ${GEM_NAME} ${GEM_VERSION} live on rubygems.org"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${GEM_NAME} ${GEM_VERSION} not visible after 120s"
          exit 1

      - name: Dispatch release-passed
        if: steps.guard.outputs.skip_push != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.OPENCDD_CI_PAT_TOKEN }}
          event-type: release-passed
